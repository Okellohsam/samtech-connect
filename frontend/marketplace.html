<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marketplace | SAMTECH CONNECT</title>

  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>

<div class="sidebar">
  <div class="logo">SAMTECH CONNECT</div>

  <ul>
    <li><a href="dashboard-expert.html">Dashboard</a></li>
    <li><a href="marketplace.html">Available Jobs</a></li>
    <li><a href="applications.html">My Applications</a></li>
    <li><a href="messages.html">Messages</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="#" onclick="logout()">Logout</a></li>
  </ul>
</div>

<div class="main">

  <div class="topbar">
    <h2>Available Jobs</h2>
    <div class="profile">
      <span id="userName"></span>
    </div>
  </div>

  <div class="card">
    <h3>Browse Opportunities</h3>

    <div id="jobsContainer">
      Loading jobs...
    </div>
  </div>

</div>

<script src="js/auth.js"></script>

<script>
const API_URL = "https://samtech-connect.onrender.com/api";

const token = localStorage.getItem("token");
const role = localStorage.getItem("role");
const userName = localStorage.getItem("name");

if (!token) {
  window.location.href = "login.html";
}

if (role !== "expert") {
  window.location.href = "dashboard-client.html";
}

document.getElementById("userName").textContent = userName;

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

async function loadJobs() {

  const container = document.getElementById("jobsContainer");

  try {

    const res = await fetch(`${API_URL}/jobs`);

    const jobs = await res.json();

    console.log(jobs);

    if (!Array.isArray(jobs)) {
      container.innerHTML = "<p>Failed to load jobs</p>";
      return;
    }

    if (jobs.length === 0) {
      container.innerHTML = "<p>No jobs available</p>";
      return;
    }

    container.innerHTML = jobs.map(job => `
      <div class="job-item">

        <h4>${job.title}</h4>

        <p>${job.description}</p>

        <p>
          <strong>Client:</strong>
          ${job.client?.name || "Unknown"}
        </p>

        <button onclick="applyForJob('${job._id}')">
          Apply Now
        </button>

      </div>
    `).join("");

  } catch (error) {

    console.error(error);

    container.innerHTML = "<p>Server connection failed</p>";
  }
}

async function applyForJob(jobId) {

  try {

    const res = await fetch(`${API_URL}/applications`, {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization": token
      },

      body: JSON.stringify({
        jobId
      })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.msg);
      return;
    }

    alert("Application submitted successfully");

  } catch (error) {

    console.error(error);

    alert("Unable to connect to server");
  }
}

loadJobs();
</script>

</body>
</html>
